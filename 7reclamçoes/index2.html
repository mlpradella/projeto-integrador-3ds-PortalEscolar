<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style2.css">
  <title>Aba de Férias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=MuseoModerno:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="card-container">
    <h1 class="titulo-pagina">Férias</h1>

    <div class="card-info principal">
      <p class="info-destaque"><strong class="label-bold">Data:</strong> 06/06/2026 a 26/06/2026</p>
      <p class="info-item"><strong class="label">Duração:</strong> 14 dias</p>
      <p class="info-item"><strong class="label">Retorno:</strong> 28/06/2026</p>
    </div>

    <div class="card-info secundario">
      <p class="info-texto"><strong>Dias Restantes:</strong> 10 dias disponíveis</p>
    </div>

    <button type="button" class="btn-voltar">Voltar</button>
  </div>

</body>

</html>

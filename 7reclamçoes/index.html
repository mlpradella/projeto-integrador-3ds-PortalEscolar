<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Reclamações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=MuseoModerno&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="card-container">
    <header class="header">
      <div class="header-left">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 6C2 4.89543 2.89543 4 4 4H20C21.1046 4 22 4.89543 22 6V18C22 19.1046 21.1046 20 20 20H4C2.89543 20 2 19.1046 2 18V6Z" fill="#FFF8BD"/>
          <path d="M2.5 6L12 13L21.5 6" stroke="#1B3252" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h1 class="title">RECLAMAÇÕES</h1>
      </div>

      <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="#FFF8BD" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </header>

    <form class="formulario-container">
      <textarea id="texto" class="campo-email" placeholder="Reclame aqui!"></textarea>

      <div class="acoes-botoes">
        <button type="button" class="botao-enviar">Voltar</button>
        <button type="submit" class="botao-enviar">Concluir</button>
      </div>
    </form>
  </div>

</body>

</html>

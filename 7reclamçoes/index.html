<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Projeto Reclamações</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=MuseoModerno&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="card-container">
    <header class="header">
      <div class="header-left">
        <h1 class="title">RECLAMAÇÕES</h1>
      </div>
    </header>

    <form class="formulario-container">
      <textarea id="texto" class="campo-email" placeholder="Reclame aqui!"></textarea>

      <div class="acoes-botoes">
        <button type="button" class="botao-enviar">Voltar</button>
        <button type="submit" class="botao-enviar">Concluir</button>
      </div>
    </form>
  </div>

</body>

</html>

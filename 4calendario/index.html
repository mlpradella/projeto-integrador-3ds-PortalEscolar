<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário Escolar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="calendario">
    <h1 id="titulo-mes">Calendário de Julho 2026</h1>

    <div class="semana">
        <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
    </div>

    <div class="dias" id="container-dias"></div>
   <div class="acoes">
        <a href="../2inicial/index.html" class="btn-voltar">Voltar</a>
    </div>
</main>

<script>
    const mesAtual = 'Julho';
    const anoAtual = 2026;
    const nomesMeses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    function criarCalendario() {
        const container = document.getElementById('container-dias');
        const numeroMes = nomesMeses.findIndex(m => m.toLowerCase() === mesAtual.toLowerCase());
        const primeiroDia = new Date(anoAtual, numeroMes, 1).getDay();
        const totalDias = new Date(anoAtual, numeroMes + 1, 0).getDate();

        container.replaceChildren();

        for (let i = 0; i < primeiroDia; i++) {
            const vazio = document.createElement('div');
            vazio.className = 'vazio';
            container.appendChild(vazio);
        }

        for (let dia = 1; dia <= totalDias; dia++) {
            const divDia = document.createElement('div');
            divDia.className = 'dia';
            divDia.innerHTML = `<span class="numero-dia">${dia}</span>`;
            container.appendChild(divDia);
        }
    }

    criarCalendario();
</script>

</body>
</html>
